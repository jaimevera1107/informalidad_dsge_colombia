name: Actualización trimestral

# DANE publishes quarterly GDP about 45 days after each quarter (mid February, May,
# August and November). The workflow runs a few days later and opens a pull request
# with the new data and results; nothing reaches the main branch without review.
on:
  schedule:
    - cron: "17 14 22 2,5,8,11 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - name: Descargar fuentes y actualizar
        run: python scripts/actualizar.py
      - name: Abrir pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: actualizacion-automatica
          delete-branch: true
          commit-message: "Actualización trimestral de datos y resultados"
          title: "Actualización trimestral de datos y resultados"
          body: |
            Actualización automática con `scripts/actualizar.py`.
            Fuentes, versiones y ajustes: `datos/actualizacion.json`.
            Revisar antes de aceptar: último trimestre, ajuste de informalidad del empalme y nuevas filas de ingresos.
          add-paths: |
            datos/datos_dsge_estimacion.csv
            datos/geih/ratio_ingresos_geih_v3.csv
            datos/geih/ratio_va_0354.csv
            datos/costos_laborales/costo_no_salarial.csv
            datos/actualizacion.json
            resultados_finales/**
